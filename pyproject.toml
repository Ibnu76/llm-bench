[project]
name = "llm-bench"
version = "0.1.0"
description = "Automated LLM provider benchmarking — latency, cost, hallucination rate, quality scoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Ibnu76"}]
keywords = ["llm", "benchmark", "ai", "evaluation", "hallucination"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
all = ["openai>=1.0.0", "anthropic>=0.20.0"]

[project.scripts]
llm-bench = "llm_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
